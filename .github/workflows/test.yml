name: Test

# "Does it build" check on PRs. The matrix lives here (the caller owns it); each leg
# calls the single-combo reusable helper. Add rows for more targets/feeds as needed.
#
# This is a carrier BSP: the buildable MACHINE is the UCM-iMX8M-Plus SOM
# (ucm-imx8m-plus), declared in both the 2024 and 2026 next feeds.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ucm-imx8m-plus, distro-release: "2026", distro-channel: next }
          - { target: ucm-imx8m-plus, distro-release: "2024", distro-channel: next }
    uses: avocado-linux/actions/.github/workflows/extension-test.yml@v1
    with:
      target:         ${{ matrix.target }}
      distro-release: ${{ matrix.distro-release }}
      distro-channel: ${{ matrix.distro-channel }}
      repo-url:       ${{ matrix.repo-url }}
