# IOT-GATE-iMX8PLUS carrier device-tree selection.
#
# Reconciled into the u-boot env by avocado-devicetree-apply (run from this
# extension's on_merge and once per boot by avocado-devicetree.service). Takes
# effect on the next reboot. Override or extend by shipping a higher-numbered
# fragment (e.g. 60-myproduct.conf) from another confext.

DEVICETREE=iot-gate-imx8plus.dtb

# Stack carrier/peripheral overlays here (space-separated, applied in order).
# Available for this board (built into the boot partition): hdmi, lvds, mipi,
# can, usbdev, rtc, spidev, pcie, ws2812b, wm8731, thermal, iot-gate gpio-keys.
# Example:
# OVERLAYS="iot-gate-imx8plus-gpio-keys.dtbo ucm-imx8m-plus-can.dtbo"
OVERLAYS=""
